<!DOCTYPE html>
<html lang = "cs" data-bs-theme="light">
    <head>
    <meta charset="utf-8">
    <title>Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

<style>
        a {
        color: #007e8f;
        text-decoration: none;
        font-weight: bold;
        transition: color 1s ease;
        } 

    h1 {
        color: rgb(22, 20, 165);
        text-align: center;
    }
    .ramecek{
        border: #007e8f solid 5px;
        max-width: 250px;
    margin:auto;
    }
</style>
    </head>
    <body style="background-color:#FBF5F3;">
        
        <div class ="ramecek">

<div style="text-align: center">

    <button onclick="prictiJedna()">Klikni na mě</button>

    <p>Počet kliknutí: <span id="pocitadlo">0</span></p>

    <button onclick="reset()">RESET</button>
</div>



    <script>
        
        let pocet = 0;


        function reset(){
            pocet = 0;
             document.getElementById("pocitadlo").textContent = 0;
        }
        
        function prictiJedna() {
            
            pocet = pocet + 1; 
            
            document.getElementById("pocitadlo").textContent = pocet;
        }
    </script>








        </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>

</html>
